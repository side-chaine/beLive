name = "belive-feed-bot"
main = "src/index.ts"
compatibility_date = "2024-01-10"
workers_dev = true

# [limits] cpu_ms = 30000 — УБРАН 02.11.2026.
#
# Блок не давал задеплоить воркер вообще: аккаунт на Free-плане, и Cloudflare
# отклоняет загрузку целиком —
#   CPU limits are not supported for the Free plan [code: 100328]
#
# Добавлен 26.06.2026 (cb509dea2), последний успешный `wrangler deploy` был
# 28.08.2026 — значит тогда план был платный. После перехода на Free все
# обновления воркера шли мимо wrangler, через Dashboard (в истории деплоев они
# помечены «Unknown (deployment)»). То есть репозиторий перестал быть
# источником правды для этого воркера.
#
# На Free CPU-лимит и так 10 мс на запрос — настраивать нечего, удаление
# ничего не меняет в поведении. Вернуть при переходе на платный план.

[vars]
ALLOWED_ORIGIN = "https://app.mybelive.com"

# Секреты (wrangler secret put):
# BOT_TOKEN — токен @BeLiveCommunity_bot
# WEBHOOK_SECRET — секрет для вебхука
# ALLOWED_TG_IDS — Telegram ID администратора (через запятую)
# JWT_SECRET — тот же, что у gateway и belive-mvsep (проверка /upload)

[[kv_namespaces]]
binding = "EPHEMERAL_KV"
id = "bd9b1fdbafd64d9d9018da2aa478d99c"

# D1 и R2 — убраны для MVP
# D1 и R2 не используются в Phase 1
