<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beLive · Единый граф</title>
<!--ROADMAP-TEMPLATE:v2 · шаблон понимает схему belive.roadmap.v2 (directions/nodes/edges); v1-шаблон со старой схемой (cards/cls) генератор отклоняет до записи-->
<style>
:root{
  color-scheme:dark;
  --bg:#0c1118; --panel:#141c27; --panel2:#182231; --line:#2a394d; --line2:#223046;
  --tx:#e6eef9; --tx2:#9fb0c6; --tx3:#6f829b;
  --done:#39d98a; --active:#ffc44d; --blocked:#ff6b6b; --waiting:#a371f7; --queued:#7f93ad; --risk:#ff6b6b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}

/* ---------- Верхняя полоса: факты ---------- */
#top{display:flex;align-items:center;gap:24px;padding:10px 16px 8px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;flex-direction:column;min-width:210px}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
#stats{display:flex;gap:26px;margin-left:auto;flex:none}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat .v{font:600 22px/1.15 var(--mono)}
.stat .l{font-size:12px;color:var(--tx3)}
.stat.prod .v{font-size:15px;color:var(--tx2);display:inline-flex;align-items:center;gap:7px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.c-active{color:var(--active)} .c-waiting{color:var(--waiting)} .c-blocked{color:var(--blocked)}
#kline{font:12px/1.4 var(--mono);color:var(--tx3);padding:4px 16px;border-bottom:1px solid var(--line2);background:rgba(20,28,39,.35);white-space:nowrap;overflow-x:auto;flex:none;scrollbar-width:thin}

/* ---------- Тулбар ---------- */
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;flex:none;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;white-space:nowrap;flex:none}
.btn:hover{border-color:#3d5474}
.btn.primary{background:var(--tx);color:#0c1118;font-weight:650;border-color:var(--tx)}
.btn.primary:hover{background:#ffffff}
.btn.primary.on{background:var(--waiting);border-color:var(--waiting);color:#fff}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;white-space:nowrap;flex:none;background:var(--panel)}
.chip.on{border-color:var(--waiting);color:var(--waiting);background:rgba(163,113,247,.12)}
.srch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;flex:none}
.srch svg{flex:none;color:var(--tx3)}
.srch input{background:none;border:0;color:var(--tx);font:13px var(--sans);padding:7px 2px;width:170px;outline:none}
.srch input::placeholder{color:var(--tx3)}
.srch .qn{font:12px var(--mono);color:var(--tx3);white-space:nowrap}
select{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font:13px var(--sans);flex:none;max-width:210px}
.legend{position:absolute;top:10px;left:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2);align-items:center;max-width:calc(100% - 24px);pointer-events:none;z-index:3}
@media(max-width:1279px){.btn .bl{display:none}}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.zooms{display:flex;gap:6px;flex:none;margin-left:auto}
.zb{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.zb:hover{border-color:#3d5474;color:var(--tx)}

/* ---------- Карта + инспектор ---------- */
#main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
#mapwrap{position:relative;min-width:0;overflow:hidden}
#map{width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
#map.dragging{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--tx3);pointer-events:none}
.src{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--tx3);pointer-events:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#insp{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;position:relative;min-height:0;scrollbar-width:thin}
.grip{display:none}

/* SVG-карта */
.nd{cursor:pointer;transition:opacity .25s}
.nd .body{fill:var(--panel2);stroke:var(--line);stroke-width:1}
.nd:hover .body{stroke:#3d5474}
.nd .ring{fill:none;stroke:transparent;transition:stroke .15s,opacity .15s}
.nd.sel .ring{stroke:var(--c);stroke-width:1.5;opacity:.55}
.nd.target .ring{stroke:var(--c);stroke-width:2;opacity:.95}
.nd .ttl{fill:var(--tx);font:600 15px var(--sans)}
.nd .stl{fill:var(--c);font:600 12px var(--sans)}
.nd .own{fill:var(--tx3);font:12px var(--sans)}
.nd .ptr{fill:#26344a}
.nd .pfl{fill:var(--c)}
.nd .nbadge rect{fill:#0c1118;stroke:var(--line)}
.nd .nbadge text{fill:var(--tx);font:700 12px var(--mono)}
.nd.off{display:none}
.nd.dim{opacity:.16}
.cluster rect{fill:rgba(20,28,39,.5);stroke:var(--line2)}
.cluster text{fill:var(--tx3);font:600 13px var(--sans);letter-spacing:1.2px;text-transform:uppercase}
.cluster.off{display:none}
.cluster{transition:opacity .25s}
.edge{fill:none;stroke:#8b9bb4;stroke-width:1.6;transition:opacity .25s}
.edge.related{stroke:#44546c;stroke-width:1.4;stroke-dasharray:3 6}
.edge.hl{stroke:#dbe7f5}
.edge.off{display:none}
#map.wn .nd:not(.target){opacity:.13}
#map.wn .edge{opacity:.07}
#map.wn .cluster{opacity:.3}
#map.wn .nd.target{opacity:1}

/* ---------- Инспектор ---------- */
#insp .head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--tx2);white-space:nowrap}
.tag.state{border-color:currentColor;font-weight:600}
.ic{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none;margin-left:auto}
.ic:hover{border-color:#3d5474;color:var(--tx)}
#insp h2{font-size:18px;margin:14px 16px 2px;line-height:1.25}
#insp .meta{font:12px var(--mono);color:var(--tx3);margin:0 16px 10px}
#insp section{padding:12px 16px;border-bottom:1px solid var(--line2)}
#insp section.last{border-bottom:0;display:flex;gap:8px;padding-bottom:20px}
#insp h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--tx2);margin:0 0 8px;font-weight:600}
.detail{margin:0;font-size:14px}
.stnote{margin:6px 0 0;font-size:12px;color:var(--tx3)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;font-size:14px}
.row .k{color:var(--tx3);flex:none}
.row b{font-weight:600;text-align:right}
.row .bar{flex:1;height:6px;background:#26344a;border-radius:3px;overflow:hidden;align-self:center}
.row .bar i{display:block;height:100%}
.pv{font:600 13px var(--mono)}
.prs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pr{font:12px var(--mono);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--tx2)}
.blk{color:var(--blocked);max-width:62%}
.nextb{border-left:3px solid currentColor;padding:6px 0 6px 12px;font-size:14px}
.nextb span{color:var(--tx)}
textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--tx);font:14px/1.5 var(--sans);padding:10px;resize:vertical;outline:none}
textarea:focus{border-color:#3d5474}
.saved{font-size:12px;color:var(--tx3);margin-top:6px;min-height:16px}
.notehint{font-size:12px;color:var(--tx3);margin:4px 0 8px}
.wn{margin:12px 16px 0;border:1px solid var(--waiting);border-radius:10px;padding:10px 12px;color:var(--waiting);font-size:13px;font-weight:700;letter-spacing:.4px}
.wn small{display:block;color:var(--tx2);font-weight:400;margin-top:3px;letter-spacing:0}
.empty{padding:48px 20px;text-align:center}
.empty svg{margin:0 auto 14px;opacity:.5}
.e1{font-size:15px;font-weight:600;margin:0 0 10px}
.e2{font-size:12px;color:var(--tx3);line-height:1.8;margin:0}

/* ---------- Тост ---------- */
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,8px);opacity:0;transition:.2s;background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;z-index:50;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Мобильная шторка ---------- */
@media(max-width:760px){
  #top{flex-wrap:wrap;gap:2px 12px;padding:8px 12px 6px}
  .brand{flex:none;width:100%;min-width:0;flex-direction:row;align-items:baseline;justify-content:space-between;gap:10px}
  .brand h1{font-size:15px}
  .brand .sub{flex:1;min-width:0;text-align:right}
  #stats{margin-left:0;width:100%;justify-content:space-between;gap:8px}
  .stat{align-items:flex-start}
  .stat .v{font-size:17px}
  .stat.prod .v{font-size:13px}
  #main{grid-template-columns:1fr}
  #insp{position:fixed;left:0;right:0;bottom:0;width:auto;height:48%;max-height:48%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:30}
  #insp.open{transform:none}
  /* при открытой шторке легенда не отжимает и не перекрывает карту (ревью CEO, P1-6) */
  body.insp-open .legend{display:none}
  .grip{display:block;width:42px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0;flex:none;cursor:pointer}
  .hint{display:none}
  .legend{top:8px;left:10px;gap:4px 12px}
}
</style>
</head>

</div>

</main>

/* ---------- 0. Утилиты ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const norm = (s) => String(s).toLowerCase().replace(/ё/g, 'е');
const trunc = (s, max) => String(s).length > max ? String(s).slice(0, max - 1) + '…' : String(s);
const isMobile = () => window.matchMedia('(max-width:760px)').matches;

const svg = $('#map'), vp = $('#vp');

/* ---------- 1. Состояния ---------- */
const ST = {
  done:    { l: 'сделано',       c: '#39d98a' },

};

const dirs = (DATA.directions || []).slice().sort((a, b) => a.order - b.order);

const nodeById = {}; nodes.forEach(n => nodeById[n.id] = n);

/* ---------- 2. Заметки владельца (localStorage) ---------- */
/* имя хранилища — не секрет; согласовано с secrets-гейтом R3: имя не должно оканчиваться на KEY */
const LS_NAME = 'belive.roadmap.notes.v2';
let notes = {};
try { notes = JSON.parse(localStorage.getItem(LS_NAME) || '{}') || {}; } catch (e) { notes = {}; }
function saveNotes() { try { localStorage.setItem(LS_NAME, JSON.stringify(notes)); } catch (e) { /* file:// без хранилища — работаем в памяти */ } }
function noteCount(id) { const t = (notes[id] || '').trim(); if (!t) return 0; return t.split('\n').filter(l => l.trim()).length; }
let saveT = null;
function queueSave(id) {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    saveNotes(); refreshBadge(id);
    const st = $('#noteStat'); if (st) st.textContent = 'Сохранено · ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }, 400);
}

/* ---------- 3. Раскладка: магистраль сверху, линии ниже ---------- */
const NW = 232, NH = 66, GX = 14, GY = 14, PX = 16, PH = 34;
let clusters = [], pos = {};

function layout() {
  clusters = []; pos = {};
  let y = 0;
  dirs.forEach(dir => {
    const dn = nodes.filter(n => n.direction === dir.id);
    if (!dn.length) return;
    const cols = dir.id === dirs[0].id ? 4 : 1;              // магистраль — грид 4 в ряд, линии — колонка
    const rows = Math.ceil(dn.length / cols);
    const w = cols * NW + (cols - 1) * GX + 2 * PX;
    const h = PH + rows * NH + (rows - 1) * GY + PX;
    clusters.push({ d: dir, x: 0, y: y, w: w, h: h, nodes: dn, cols: cols });
    dn.forEach((n, i) => {
      pos[n.id] = {
        x: 0 + PX + (i % cols) * (NW + GX),
        y: y + PH + Math.floor(i / cols) * (NH + GY)
      };
    });
    y += h + 90;
  });
  /* линейки кластеров раскладываем в ряды по 4 */
  const rest = clusters.slice(1);
  const gapX = 56, perRow = 4;
  let x = 0, rowH = 0, yy = clusters.length ? clusters[0].h + 90 : 0, rowStart = 0;
  clusters[0] && (clusters[0].x = 0);
  let idx = 0;
  rest.forEach((c, i) => {
    if (i > 0 && i % perRow === 0) { yy += rowH + 90; x = 0; rowH = 0; }
    c.x = x; c.y = yy;
    c.nodes.forEach((n, j) => { pos[n.id] = { x: c.x + PX, y: c.y + PH + j * (NH + GY) }; });
    x += c.w + gapX; rowH = Math.max(rowH, c.h); idx = i;
  });
}

function worldBBox() {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  clusters.forEach(c => {
    if (c.nodes.every(n => !nodeVisible(n))) return;
    x1 = Math.min(x1, c.x); y1 = Math.min(y1, c.y);
    x2 = Math.max(x2, c.x + c.w); y2 = Math.max(y2, c.y + c.h);
  });
  if (x1 > x2) return { x: 0, y: 0, w: 100, h: 100 };
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

/* ---------- 4. Рендер SVG ---------- */
function edgeD(a, b) {
  const ax = a.x + NW / 2, ay = a.y + NH / 2, bx = b.x + NW / 2, by = b.y + NH / 2;
  const dx = bx - ax, dy = by - ay;
  if (Math.abs(dx) >= Math.abs(dy)) {
    const sx = dx > 0 ? a.x + NW : a.x, sy = a.y + NH / 2, tx = dx > 0 ? b.x : b.x + NW, ty = b.y + NH / 2;
    const mx = (sx + tx) / 2;
    return `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
  }
  const sx = a.x + NW / 2, sy = dy > 0 ? a.y + NH : a.y, tx = b.x + NW / 2, ty = dy > 0 ? b.y : b.y + NH;
  const my = (sy + ty) / 2;
  return `M ${sx} ${sy} C ${sx} ${my}, ${tx} ${my}, ${tx} ${ty}`;
}

function badgeHtml() {
  return `<g class="nbadge"><rect x="${NW - 36}" y="8" width="23" height="18" rx="9"/><text x="${NW - 24.5}" y="21.5" text-anchor="middle">1</text></g>`;
}

function nodeSvg(n) {
  const s = ST[n.state] || ST.queued, p = pos[n.id], c = s.c;
  const t = /^N\d/.test(n.id) ? `${n.id} · ${n.title}` : n.title;
  const acc = s.hatch
    ? `<rect class="acc" width="4" height="${NH}" rx="2" fill="#3d1a1a"/><rect class="acc" width="4" height="${NH}" rx="2" fill="url(#rh)"/>`
    : `<rect class="acc" width="4" height="${NH}" rx="2" fill="${c}"/>`;
  return `<g class="nd st-${n.state}" data-id="${esc(n.id)}" style="--c:${c}" transform="translate(${p.x},${p.y})">
  <title>${esc(n.id + ' · ' + n.title)}</title>
  <rect class="ring" x="-6" y="-6" width="${NW + 12}" height="${NH + 12}" rx="16"/>
  <rect class="body" width="${NW}" height="${NH}" rx="10"/>
  ${acc}
  <text class="ttl" x="16" y="26">${esc(trunc(t, 24))}</text>
  <circle cx="21" cy="45" r="3.5" fill="${c}"/>
  <text class="stl" x="31" y="49">${s.l}</text>
  <text class="own" x="${NW - 16}" y="49" text-anchor="end">${esc(trunc(String(n.owner), 16))}</text>
  <rect class="ptr" x="16" y="55" width="${NW - 32}" height="3" rx="1.5"/>
  ${n.progress ? `<rect class="pfl" x="16" y="55" width="${(NW - 32) * n.progress / 100}" height="3" rx="1.5"/>` : ''}
  ${noteCount(n.id) ? badgeHtml().replace('>1<', '>' + noteCount(n.id) + '<') : ''}
</g>`;
}

function render() {
  $('#gClusters').innerHTML = clusters.map(c =>
    `<g class="cluster" data-dir="${esc(c.d.id)}"><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="14"/><text x="${c.x + PX + 2}" y="${c.y + 22}">${esc(trunc(c.d.title, 30))}</text></g>`).join('');
  $('#gEdges').innerHTML = edges.filter(e => pos[e.from] && pos[e.to]).map(e =>
    `<path class="edge ${e.kind}" data-f="${esc(e.from)}" data-t="${esc(e.to)}" d="${edgeD(pos[e.from], pos[e.to])}" marker-end="url(#${e.kind === 'depends' ? 'arD' : 'arR'})"/>`).join('');
  $('#gNodes').innerHTML = nodes.map(nodeSvg).join('');
}

function refreshBadge(id) {
  const g = $(`.nd[data-id="${CSS.escape(id)}"]`); if (!g) return;
  const cnt = noteCount(id); let b = g.querySelector('.nbadge');
  if (cnt && !b) { g.insertAdjacentHTML('beforeend', badgeHtml().replace('>1<', '>' + cnt + '<')); }
  else if (!cnt && b) { b.remove(); }
  else if (cnt && b) { b.querySelector('text').textContent = cnt; }
}

/* ---------- 5. Панорама и зум ---------- */
let V = { x: 0, y: 0, k: 1 };
function applyView() { vp.setAttribute('transform', `translate(${V.x} ${V.y}) scale(${V.k})`); }
function zoomToK(k, cx, cy) {
  const r = svg.getBoundingClientRect(); k = clamp(k, .15, 2.5);
  const wx = (cx - r.left - V.x) / V.k, wy = (cy - r.top - V.y) / V.k;
  V.k = k; V.x = cx - r.left - wx * k; V.y = cy - r.top - wy * k; applyView();
}
function fit() {
  const b = worldBBox(), r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const k = clamp(Math.min(r.width / (b.w + 40), r.height / (b.h + 40)), .15, 1.4);
  V.k = k; V.x = (r.width - b.w * k) / 2 - b.x * k; V.y = (r.height - b.h * k) / 2 - b.y * k; applyView();
}
function centerOn(id) {
  const p = pos[id]; if (!p) return; const r = svg.getBoundingClientRect();
  let cy = r.top + r.height / 2;                      /* центр карты в координатах окна */
  if (isMobile()) {
    /* шторка 48% экрана — видимая полоса карты ~52% высоты окна; легенда при открытой шторке скрыта */
    const visBottom = window.innerHeight * 0.52;
    const legendBottom = document.querySelector('#legend').getBoundingClientRect().bottom;
    const top = Math.max(r.top, legendBottom + 4);
    cy = clamp((top + visBottom) / 2, r.top + 36, Math.max(r.top + 36, visBottom - 36));
  }
  const k = Math.max(V.k, .9);
  V.k = k; V.x = r.width / 2 - (p.x + NW / 2) * k; V.y = cy - r.top - (p.y + NH / 2) * k; applyView();
}

svg.addEventListener('wheel', e => { e.preventDefault(); zoomToK(V.k * Math.exp(-e.deltaY * 0.0013), e.clientX, e.clientY); }, { passive: false });
$('#zIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomToK(V.k * 1.25, r.left + r.width / 2, r.top + r.height / 2); };
$('#zOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomToK(V.k / 1.25, r.left + r.width / 2, r.top + r.height / 2); };
$('#zFit').onclick = () => fit();

let drag = null, pinch = null; const ptrs = new Map();
function reinitDrag(id) { const p = ptrs.get(id); if (p) drag = { sx: p.x, sy: p.y, vx: V.x, vy: V.y, moved: 99, target: null, mid: false }; }
svg.addEventListener('pointerdown', e => {
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, vx: V.x, vy: V.y, moved: 0, target: e.target };
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch = { d0: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), k0: V.k }; drag = null; }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch) {
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    zoomToK(pinch.k0 * d / pinch.d0, (a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2);
  } else if (drag) {
    drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy));
    if (drag.moved > 4) svg.classList.add('dragging');
    V.x = drag.vx + (e.clientX - drag.sx); V.y = drag.vy + (e.clientY - drag.sy); applyView();
  }
});
function endPointer(e) {
  const wasClick = drag && drag.moved < 7;
  const tgt = drag ? drag.target : null;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const rid = [...ptrs.keys()][0]; reinitDrag(rid); }
  else drag = null;
  svg.classList.remove('dragging');
  if (wasClick) {
    const g = tgt && tgt.closest ? tgt.closest('.nd') : null;
    if (g) select(g.dataset.id);
    else if (whatnow) { /* в режиме «что сейчас» клики мимо не сбрасывают акцент */ }
    else if (isMobile()) closeSheet();
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; drag = null; svg.classList.remove('dragging'); });

/* подсветка связей при наведении */
svg.addEventListener('mouseover', e => {
  const g = e.target.closest ? e.target.closest('.nd') : null; if (!g) return;
  $$('.edge').forEach(el => el.classList.toggle('hl', el.dataset.f === g.dataset.id || el.dataset.t === g.dataset.id));
});
svg.addEventListener('mouseout', () => $$('.edge').forEach(el => el.classList.remove('hl')));

/* ---------- 6. Фильтры ---------- */
let filters = { q: '', dir: 'all', owner: 'all', wait: false };
function nodeVisible(n) {
  if (filters.dir !== 'all' && n.direction !== filters.dir) return false;
  if (filters.owner !== 'all' && !String(n.owner).includes(filters.owner)) return false;
  if (filters.wait && n.state !== 'waiting') return false;
  return true;
}
const matchQ = (n, q) => norm(n.title + ' ' + n.id).includes(q);
function applyFilters(refit) {
  const q = norm(filters.q.trim());
  nodes.forEach(n => {
    const el = $(`.nd[data-id="${CSS.escape(n.id)}"]`); if (!el) return;
    const vis = nodeVisible(n);
    el.classList.toggle('off', !vis);
    el.classList.toggle('dim', vis && !!q && !matchQ(n, q));
  });
  clusters.forEach(c => {
    const el = $(`.cluster[data-dir="${CSS.escape(c.d.id)}"]`); if (!el) return;
    el.classList.toggle('off', !c.nodes.some(nodeVisible));
  });
  /* рёбра перебираем по DOM-элементам: у узла может быть несколько исходящих,
     селектор по data-f цеплял только первое — второе висело к скрытому узлу (ревью CEO, P1-5) */
  $$('.edge').forEach(el => {
    const a = nodeById[el.dataset.f], b = nodeById[el.dataset.t];
    el.classList.toggle('off', !(a && b && nodeVisible(a) && nodeVisible(b)));
  });
  if (q) { const hits = nodes.filter(n => nodeVisible(n) && matchQ(n, q)).length; $('#qn').textContent = hits + '/' + nodes.filter(nodeVisible).length; }
  else $('#qn').textContent = '';
  if (refit) fit();
}

/* ---------- 7. Инспектор ---------- */
let sel = null;
function select(id, opts = {}) {
  sel = id;
  $$('.nd').forEach(e2 => e2.classList.toggle('sel', e2.dataset.id === id));
  renderInspector();
  if (isMobile()) { $('#insp').classList.add('open'); document.body.classList.add('insp-open'); centerOn(id); }
  else if (opts.center) centerOn(id);
}
function deselect() {
  sel = null;
  $$('.nd').forEach(e2 => e2.classList.remove('sel'));
  renderInspector(); closeSheet();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function closeSheet() { $('#insp').classList.remove('open'); document.body.classList.remove('insp-open'); }
$('#grip').onclick = closeSheet;

const ICON_X = '<svg width="12" height="12" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M3 3l10 10M13 3L3 13"/></svg>';
const ICON_LINK = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 9.5a3.2 3.2 0 010-4.5l2-2a3.2 3.2 0 014.5 4.5l-1 1M9.5 6.5a3.2 3.2 0 010 4.5l-2 2a3.2 3.2 0 01-4.5-4.5l1-1"/></svg>';

function renderInspector() {
  const n = sel ? nodeById[sel] : null, body = $('#inspBody');
  if (!n) {
    body.innerHTML = `<div class="empty">
      <svg width="120" height="54" viewBox="0 0 120 54" fill="none" stroke="#6f829b" stroke-width="1.4">
        <rect x="4" y="8" width="30" height="16" rx="4"/><rect x="46" y="8" width="30" height="16" rx="4"/><rect x="88" y="32" width="28" height="16" rx="4"/>
        <path d="M34 16h12M76 16h12c4 0 8 4 8 8v8" stroke-dasharray="2 3"/>
      </svg>
      <p class="e1">Выберите узел на карте</p>
      <p class="e2">Панорама — тяните карту, зум — колесо или щипок<br>
      «Что делать сейчас» подсвечит следующий шаг<br>
      Заметки живут на узлах и сохраняются сами</p>
    </div>`;
    return;
  }
  const s = ST[n.state] || ST.queued, dir = dirById[n.direction] || { title: '—' };
  const wn = whatnow && whatnow.n.id === n.id
    ? `<div class="wn">СЛЕДУЮЩИЙ ШАГ<small>${esc(whatnow.why)}</small></div>` : '';
  body.innerHTML = `${wn}
  <div class="head">
    <span class="tag">${esc(dir.title)}</span>
    <span class="tag state" style="color:${s.c}">${s.l}</span>
    <button class="ic" id="inspClose" title="Закрыть (Esc)">${ICON_X}</button>
  </div>
  <h2>${esc(n.title)}</h2>
  <div class="meta">${esc(n.id)} · обновлено ${esc(n.updated)}</div>
  <section><h3>Что это</h3><p class="detail">${esc(n.detail)}</p>${n.st ? `<p class="stnote">${esc(n.st)}</p>` : ''}</section>
  <section><h3>Состояние</h3>
    <div class="row"><span class="k">Прогресс</span><span class="bar"><i style="width:${n.progress}%;background:${s.c}"></i></span><b class="pv">${n.progress}%</b></div>
    <div class="row"><span class="k">Владелец</span><b>${esc(n.owner)}</b></div>
    ${n.pr && n.pr.length ? `<div class="row"><span class="k">PR</span><span class="prs">${n.pr.map(p => `<span class="pr">#${p}</span>`).join('')}</span></div>` : ''}
    ${n.blocker ? `<div class="row"><span class="k">Блокер</span><b class="blk">${esc(n.blocker)}</b></div>` : ''}
  </section>
  <section><h3>Что дальше</h3><div class="nextb" style="color:${s.c}"><span>${esc(n.next)}</span></div></section>
  <section><h3>Заметки</h3>
    <div class="notehint">Сохраняются в этом браузере автоматически. Экспортируй — и забирай на другое устройство.</div>
    <textarea id="noteTa" placeholder="Решения, оговорки, «не забыть»…"></textarea>
    <div class="saved" id="noteStat"></div>
  </section>
  <section class="last"><button class="btn" id="btnLink">${ICON_LINK} Ссылка на узел</button></section>`;
  const ta = $('#noteTa'); ta.value = notes[n.id] || '';
  ta.addEventListener('input', () => { notes[n.id] = ta.value; queueSave(n.id); });
  $('#inspClose').onclick = deselect;
  $('#btnLink').onclick = () => {
    location.hash = 'node-' + n.id;
    try { navigator.clipboard.writeText(location.href).then(() => toast('Ссылка скопирована'), () => toast('Ссылка: ' + location.hash)); }
    catch (e) { toast('Ссылка: ' + location.hash); }
  };
}

/* ---------- 8. Режим «Что делать сейчас» ---------- */
let whatnow = null;
function computeWhatNow() {
  const vis = nodes;
  const w = vis.filter(n => n.state === 'waiting').sort((a, b) => (a.priority ?? 900) - (b.priority ?? 900));
  if (w.length) return { n: w[0], why: 'Ждёт вашего решения — без вас не двигается.' };
  const b = vis.filter(n => n.state === 'blocked' || n.state === 'risk');
  if (b.length) return { n: b[0], why: 'Заблокировано — держит зависимые узлы.' };
  const a = vis.filter(n => n.state === 'active').sort((x, y) => y.progress - x.progress);
  return a[0] ? { n: a[0], why: 'Самая продвинутая задача в работе.' } : null;
}
function setWhatNow(on) {
  if (on) {
    whatnow = computeWhatNow();
    if (!whatnow) { toast('Нечего подсвечивать — узлов нет'); return; }
    svg.classList.add('wn');
    $$('.nd').forEach(e2 => e2.classList.toggle('target', e2.dataset.id === whatnow.n.id));
    $('#btnWn').classList.add('on');
    select(whatnow.n.id, { center: true });
    toast('Сейчас: ' + whatnow.n.title);
  } else {
    whatnow = null;
    svg.classList.remove('wn');
    $$('.nd').forEach(e2 => e2.classList.remove('target'));
    $('#btnWn').classList.remove('on');
    if (sel) renderInspector();
  }
}
$('#btnWn').onclick = () => setWhatNow(!whatnow);

/* ---------- 9. Экспорт / импорт заметок ---------- */
$('#btnExp').onclick = () => {
  const cnt = Object.values(notes).filter(v => String(v).trim()).length;
  const payload = { app: 'beLive.roadmap.notes', version: 2, exported: new Date().toISOString(), notes: notes };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'belive-roadmap-notes.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
  toast(cnt ? 'Экспортировано заметок: ' + cnt + ' — belive-roadmap-notes.json' : 'Заметок пока нет — файл-пустышка');
};
$('#btnImp').onclick = () => $('#fileImp').click();
$('#fileImp').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const inc = (j && j.notes && typeof j.notes === 'object') ? j.notes : null;
      if (!inc) throw new Error('нет поля notes');
      let cnt = 0;
      for (const k of Object.keys(inc)) {
        if (typeof inc[k] === 'string' && inc[k].trim()) { notes[k] = inc[k]; cnt++; }
        else delete notes[k];
      }
      saveNotes(); nodes.forEach(n => refreshBadge(n.id));
      if (sel) renderInspector();
      toast('Импортировано заметок: ' + cnt);
    } catch (err) { toast('Импорт не удался: ' + (err.message || 'битый JSON')); }
  };
  r.readAsText(f); e.target.value = '';
});

/* ---------- 10. Тост, клавиатура ---------- */
let toastT = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
document.addEventListener('keydown', e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !inField) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { if (whatnow) setWhatNow(false); else if (sel) deselect(); }
});

/* ---------- 11. Верхняя полоса, легенда, тулбар ---------- */
function renderStats() {
  const cnt = st => nodes.filter(n => n.state === st).length;
  /* «prod» не отслеживается: SHA деплоя нигде не выводится, поэтому в шапке
     честный снимок main, а не непроверяемое «prod» (ревью CEO, P0-3) */
  $('#prodV').textContent = (DATA.meta && DATA.meta.main) || '—';
  $('#stActive').textContent = cnt('active');
  /* решения — узлы с priority (dec-*); линии, стоящие за тем же решением,
     не считаются: двойного счёта нет (ревью CEO, P1-4) */
  $('#stWait').textContent = nodes.filter(n => n.state === 'waiting' && n.priority !== undefined).length;
  /* «с блокером» = непустое поле blocker при любом состоянии; сами состояния
     «заблокировано» показываются отдельной метрикой ниже (ревью CEO, P0-2) */
  $('#stBlocked').textContent = nodes.filter(n => n.blocker && String(n.blocker).trim()).length;
  const g = (DATA.meta && DATA.meta.generated) || '';
  const dt = g.slice(8, 10) + '.' + g.slice(5, 7) + ' ' + g.slice(11, 16);
  $('#sub').textContent = 'снимок ' + dt + ' · ' + ((DATA.meta && DATA.meta.command) || '');
  const small = ['сделано ' + cnt('done'), 'заблокировано ' + cnt('blocked'), 'риск ' + cnt('risk'), 'в очереди ' + cnt('queued')];
  if (DATA.meta && DATA.meta.kpi) DATA.meta.kpi.forEach(k => small.push(k[0] + ' ' + k[1]));
  if (DATA.meta && DATA.meta.drift) small.push('дрейф: ' + DATA.meta.drift);
  $('#kline').textContent = small.join(' · ');
  $('#srcNote').textContent = 'данные: docs/roadmap/roadmap-data.json · генератор: scripts/generate-roadmap.mjs · блок данных руками не правится';
}
function renderLegend() {
  $('#legend').innerHTML = Object.entries(ST).map(([k, s]) =>
    `<span class="lg"><i style="background:${s.c};${s.hatch ? 'background-image:repeating-linear-gradient(45deg,#ff6b6b 0 3px,#3d1a1a 3px 6px);' : ''}"></i>${s.l}</span>`).join('');
}
function buildToolbar() {
  $('#selDir').innerHTML = `<option value="all">Все направления</option>` +
    dirs.map(d => `<option value="${esc(d.id)}">${esc(d.title)}</option>`).join('');
  const toks = new Set();
  nodes.forEach(n => String(n.owner).split(/\s*[\/+,→]\s*/).forEach(t => { t = t.trim(); if (t) toks.add(t); }));
  $('#selOwner').innerHTML = `<option value="all">Все владельцы</option>` +
    [...toks].sort((a, b) => a.localeCompare(b, 'ru')).map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#selDir').onchange = e => { filters.dir = e.target.value; applyFilters(true); };
  $('#selOwner').onchange = e => { filters.owner = e.target.value; applyFilters(true); };
  $('#chipWait').onclick = () => {
    filters.wait = !filters.wait;
    $('#chipWait').classList.toggle('on', filters.wait);
    applyFilters(true);
  };
  $('#q').addEventListener('input', e => { filters.q = e.target.value; applyFilters(false); });
}

/* ---------- 12. Инициализация ---------- */
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(fit, 150); });
buildToolbar(); renderLegend(); renderStats(); renderInspector();
layout(); render(); applyFilters(false); fit();
const h = location.hash.match(/^#node-(.+)$/);
if (h && nodeById[h[1]]) select(h[1], { center: true });
</script>
