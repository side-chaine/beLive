# =====================================================================
# load-atoms.yaml — консьюмер-контракт обсерватория загрузки (OBS-1)
# docs-only ресурс для 006/001 (707-рендер ВНЕ скоупа).
# =====================================================================
meta:
  scope: docs-only # 006/001; 707-рендер вне скоупа
  contract: load-atoms
  head: "see git log -1 --format=%h after commit; anchor keys are comment-texts, immune to drift"
  source: src/audio/engine-v3/integration/V3DataInterceptor.ts
  created: 2026-09-03

# ---------------------------------------------------------------------
# КОНТРАКТ (6 пунктов)
# ---------------------------------------------------------------------
contract:
  - "ДЕЛЬТЫ не абсолюты: используй(ts) разность пар performance.mark (monotonic), НЕ абсолютные значения"
  - "monotonic не wall-clock: мост к wall-clock = M2-лог main.tsx:237"
  - "неполный кластер = abort-норма (:115/:156 generation-check) — НЕ ошибка, урезанные кластеры допустимы"
  - "guard = вход-не-успех: отсутствие марки в начале цепочки значит, что ступень не достигнута"
  - "буфер ~150: performance buffer по умолчанию ~150 entries — старые метки вытесняются, читай свежую сессию"
  - "docs-only: контракт без кода; 707-рендер вне скоупа"

# ---------------------------------------------------------------------
# МАРКИ belive:load:NN — КЛЮЧИ = СОКРАЩЁННЫЕ ТЕКСТЫ КОММЕНТАРИЕВ (якоря).
# Якоря = текст комментария (НЕ номера строк) — устойчивы к сдвигам.
# Каждый якорь должен резолвиться ровно в 1 совпадение по пост-патч дереву.
# ---------------------------------------------------------------------
marks:
  - key: "belive:load:02-reset"
    anchor: "// 1. 🛑 Stop, но НЕ сбрасываем pipeline (оставляем старые WASM буферы живыми)"
    stage: "стоп/сброс прошлого трека"
  - key: "belive:load:03-jobs"
    anchor: "// 2. Build decode jobs"
    stage: "сборка decode jobs"
  - key: "belive:load:04-decode"
    anchor: "// 3. 🔄 ATOMIC: decode ВСЕ сначала (до pipeline.reset)"
    stage: "decode ×N (ATOMIC, до pipeline.reset)"
  - key: "belive:load:05-wasm-reset"
    anchor: "// 5. 🧹 Теперь сбрасываем pipeline (старые буферы больше не нужны)"
    stage: "WASM pipeline reset"
  - key: "belive:load:06-wasm-load"
    anchor: "// 6. Добавляем в orchestrator + pipeline"
    stage: "WASM load ×N"
  - key: "belive:load:07-activate"
    anchor: "// 8. 🎯 Zombie Kill Switch — заглушить V2 + запуск V3 с offset + safety net 🔴"
    stage: "активация + play (safety net 5s)"
  - key: "belive:load:08-loaded"
    anchor: "// 🪦 OBS-1: __setLoadingV3 был сеттер-фантомом (нигде не определён, 3 вызова = no-op) — удалён."
    stage: "загрузка завершена (надгробие фантома; метка после надгробия)"
  - key: "belive:load:09-dispatch"
    anchor: "// M1-2 (342, расширение): V3 заменяет V2 как источник 'track-loaded'."
    stage: "dispatch track-loaded"

# ---------------------------------------------------------------------
# ПРИМЕЧАНИЯ ПО ЧТЕНИЮ
# ---------------------------------------------------------------------
notes:
  - "07→08≈0 без track-loaded = активация пропущена (У-4): 08 не появится если минули 07 без успешного dispatch"
  - "abort :115/:156 (generation) роняет цепочку до 05/07 — урезанный кластер это норма"
  - "08-loaded НЕ появляется при abort — смотри :115 (до 05) и :156 (после 06)"
