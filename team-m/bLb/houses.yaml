# КОНТРАКТ v0.3 (дельта к v0.2):
#   - status: alive | demo | planned | conserved | external (trash убран: снос доказывается отдельно)
#   - floors: каждый этаж = реальный файл/модуль живого дерева; «тёмный этаж» = пустой .gitkeep
#   - КРИТЕРИЙ ЭТАПА 2: 19+ зданий = живые режимы, ни одного этажа без файла
# t30 = -1 → досчитает city-metrics.mjs на ПК (git log 30 дней)

