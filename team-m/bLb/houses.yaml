# Метро: имя линии = реальное событие EventBus v2 (канал:событие, src/foundation/event-bus/types.ts)
# или служебное событие города city:*. Импульс едет from -> to при событии.
metro:
  - id: m-play
    from: studio
    to: sync
    ev: audio:playback-state-changed
    pulse: 1
  - id: m-stem
    from: studio
    to: notes
    ev: audio:track-stem-ready
    pulse: 1
  - id: m-mic
    from: studio
    to: live
    ev: audio:microphone-state-changed
    pulse: 1
    via: "8.6,3.4"
  - id: m-mix
    from: studio
    to: split
    ev: audio:vocalmix-state-changed
    pulse: 1
  - id: m-line
    from: sync
    to: show
    ev: sync:active-line-changed
    pulse: 1
    via: "6.6,3.6"
  - id: m-loop
    from: sync
    to: academy
    ev: sync:loop-set
    pulse: 0
    via: "5.0,8.5"
  - id: m-load
    from: catalog
    to: studio
    ev: audio:track-loaded
    pulse: 1
    via: "6.0,7.0"
  - id: m-saved
    from: catalog
    to: hub
    ev: catalog:track-saved
    pulse: 0
  - id: m-take
    from: academy
    to: hub
    ev: practice:state-changed
    pulse: 0
    via: "5.6,10.2"
  - id: m-scenes
    from: scenes
    to: show
    ev: ui:block-scenes-loaded
    pulse: 0
    via: "4.5,4.8"
  - id: m-sect
    from: dna
    to: catalog
    ev: sync:sections-updated
    pulse: 0
  - id: m-mode
    from: gates
    to: catalog
    ev: ui:mode-changed
    pulse: 0
  - id: m-billy
    from: billy
    to: catalog
    ev: city:billy-say
    pulse: 1
    via: "6.2,3.2;6.6,8.6"
  - id: cut
    from: blocks-old
    to: none
    ev: city:severed
    pulse: 0
    via: "11.4,8.2"

