# Модель (Никита 30.08 01:14): «каждый объект — этаж, каждое здание — режим».
# Планировка — 301 (9 районов / 19 зданий / 71 этаж, 05-VISUAL-MAP-TO-bLb.md §1.1).
# Сборка — 707, кросс-чек — 301. Метрики пересняты 007 после Волн C+D + де-фриза @ 30f2c8d — КАДАСТРОВАЯ ПРАВДА 04.09 (город отражает репо на 04.09, не на 28.08).
