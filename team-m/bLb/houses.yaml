    - "Мак 28.08: метрики loc/files — реальные замеры 28.08; t30 досчитает ПК через city-metrics.mjs"
  gates:
    - id: W5
      desc: "снос Старой мастерской (BAC-107) — только после волны W5"
      state: open
    - id: rehearsal-prod
      desc: "стройка Арен — только после Репетиции к проду"
      state: open

