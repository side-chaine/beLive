# houses.yaml · beLiveBase · v0.2 (единый кадастр города)
# Формат — контракт для city-gen.mjs (валидация + инъекция в bLb-CITY-v0.2-quiet.html)
# и для city-metrics.mjs (ПК досчитывает loc/files/t30 по modules и пишет city-metrics.json)
#
# Легенда статуса: alive | demo | planned | conserved | trash | cleared | external
# gate: имя гейта из meta.gates, который ДОЛЖЕН ПРОЙТИ, прежде чем здание сменит статус
# rooms: список "Название|описание простыми словами" (комнаты = смысловые модули)
# metrics.t30 = -1 означает "ещё не посчитано ПК" (city-metrics.mjs)

meta:
  version: 0.2
  date: 2026-08-28
  author: mac
  layout: glm-v0.2-quiet (сетка 15x14, одобрена Боссом 28.08 как база)
  decisions:
    - "Босс 28.08: дыры ownership — решает Мак; дефолт center/007 (keeper 007)"
