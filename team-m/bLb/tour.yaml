# tour.yaml · beLiveBase · сценарий YouTube-тура (цепочка, не трек)
# Формат: остановки последовательно; камера летит на здание, титр снизу, шёпот.
# building: key здания из houses.yaml; "center" = общий план города.
# dur: секунды на остановке; zoom: масштаб камеры (по умолчанию 1.5).
# city-gen.mjs вшивает TOUR в bLb-CITY-v0.2-quiet.html между /*TOUR-START*/ и /*TOUR-END*/.

meta:
  name: Первый тур по городу
  version: 0.1
  date: 2026-08-28
  note: >
    Маршрут: вход -> площадь -> фабрика звука -> свет слова -> театр -> эфир -> Билли -> будущее.
    Финал: общий план + CTA. Для каждого ролика можно собрать свой tour-*.yaml и подсунуть city-gen.

stops:
  - building: gates
    dur: 4.2
    say: "Вход без забора. Зашёл — и сразу поёшь."
  - building: catalog
    dur: 4.2
    say: "Главная площадь: все треки города лежат здесь."
  - building: studio
    dur: 5.0
    say: "Фабрика звука. Слышит каждую ноту."
  - building: sync
    dur: 4.2
    say: "Здесь рождается свет слова."
  - building: show
    dur: 4.2
    say: "Режиссёр твоего выступления."
  - building: live
    dur: 4.2
    say: "Отсюда твой голос уходит в мир."
  - building: billy
    dur: 4.6
    say: "И за всем этим следит Билли."
  - building: karaoke
    dur: 4.2
    say: "А это будущее: новые залы. Пока — чертёж."
    zoom: 1.7
  - building: center
    dur: 5.0
    zoom: 1.0
    say: "Вот так звучит город. Подписывайся — дальше строим."
