# PULSE-ZONES.yaml · реестр зон патруля ПУЛЬСа · v0.1
# Данные-истина для зонных агентов. Промпты ссылаются сюда, 007 режет по зонам.
# Статусы: pilot (смена сейчас) · wave1 · wave2 · audit (разведка) · sandbox (песочница 007_2)

meta:
  system: ПУЛЬС (PULSE)          # N-12 DECISIONS.md, Никита 06.09
  canon-line: "ПУЛЬС: 6 гейтов · violations=N · zones-active=N"   # 007 вшил в CI-вывод
  patrol-rule: "смены по диспатчу 007 (opencode run, без TUI); НЕ стоящие процессы — RAM-урок 05.09"
  prod-code: "только Оператор через цепь; патруль мониторит + предлагает"
  report: "LOG-блок «🛡 [зона] agent-X» в SHARED-REGISTRY.md"
  formula: "ФОРМУЛА НИКИТЫ для инструмент-агентов: ① погружение (скан проекта → скауты → своя зона) → ② доклад «ПОГРУЖЕНИЕ» → ③ СТОП: план развития рассказывает Никита → ④ работа по плану с прогонами 001→005→002→001→009"
  zone-chain: "001 → 005 (лучшее ли решение? либы/прецеденты) → 002 (стресс) → 001 (ревизия) → 009 (верификация) — цепочка зонных прогонов (канон Никиты 06.09)"

zones:
  - id: B01-HUB
    name: Репетиция — ГЛАВНЫЙ ХАБ (флагман)
    agent: agent-rehearsal
    status: pilot            # главный агент зоны; дизайн нового Репетиции = 007_2 в песочнице (отказ от нижнего ДОК)
    paths: [src/App.tsx, src/components/RehearsalLyrics*, src/components/KaraokeLyricsBoard*, src/components/WagonTrain*, src/components/TransportBar*, src/components/ControlDeck.tsx (текущий ДОК — уходим от него)]
    focus: "хаб-координация инструментов зоны · PIXEL-DELTA 006 (мост «как есть»→«как будет») · GPT-контракт 3-колоночности · баг таймера · стыки с агентами Studio/Quest/Show/Pitch/Split"
    team: "B01-mixer(Studio) · B02(Quest) · B03(Show) · B06(Pitch) · B04(Split) — у каждого СВОЙ агент; хаб координирует стыки, не лезет в их зоны"
    forbidden: "песочница 007_2 (её мир) · выдумывание плана развития (ждёт Никиту) · frozen-зоны"

  - id: B09
    name: Порт Каталог
    agent: agent-port
    status: pilot            # волна 0
    paths: [src/catalog/**, src/services/upload/**, src/components/welcome/**]
    focus: "3 лифта загрузки (zip/TG/ручная) · целостность каталога · скорость стыка B01+B09"
    forbidden: "визуал каталога (песочница 007_2+006) · чужие зоны"

  - id: B08
    name: Башня Sync
    agent: agent-sync
    status: pilot            # волна 0 — заказ Никиты: ПОЛНЫЙ разбор всех функций
    paths: [src/sync/**, src/sync/components/**]   # фикс 007 06.09: src/components/SyncWaveform*/** не существует (находка B08-патруля, досье §карта)
    focus: "полный разбор всех функций Sync-редактора · word-sync · LRC/теги · карты синхронизации"
    forbidden: "мимикрия под Оператора — только разбор + предложения"

  - id: PHONE
    name: Phone (горизонталь)
    agent: agent-phone-audit
    status: audit            # аудит-фаза → потом патруль responsive-слоя
    paths: [src/**/*.css, src/hooks/*resize*, src/hooks/*media*]
    focus: "аудит: @media-карта (7 файлов) · вердикты 768/390px · touch (pointer:coarse) · приговор 3-колоночному GPT-контракту на 390px"
    rule: "горизонтальный слой: власть ТОЛЬКО над responsive-слоем, бизнес-логику зон не трогает"
    forbidden: "бизнес-логика вертикальных зон · прод-код без Оператора"

  - id: B01-screen
    name: Завод · экран Репетиции
    agent: agent-factory
    status: wave1
    paths: [src/components/RehearsalLyrics*, src/components/KaraokeLyricsBoard*, src/components/WagonTrain*, src/components/TransportBar*]
    focus: "рендер лирики (data-model 006) · TrackMap (data-block-type) · тайминги транспорта · баг таймера 006"
    forbidden: "микшер-этаж (у него свой агент) · frozen-зоны"

  - id: B01-mixer
    name: Studio — отдельная СРЕДА для проработки
    agent: agent-studio
    status: wave1             # формула: погружение → доклад → план Никиты
    paths: [src/components/MixerPanel*, src/stem/**, src/audio/engine-v3/pipeline/**]   # фикс 007 06.09: src/stores/stem* не существует — стем-стор в src/stem/ (находка погружения B01-mixer, досье §коррекция-путей)
    focus: "MixerPanel · стемы · шины BusFader18 · solo/mute/V-Mix · план развития — от Никиты после доклада"
    forbidden: "выдумывать план · frozen-зоны (AudioEngineV2/patchV1/bridges/orchestrator — чтение только)"

  - id: B02
    name: Quest — отдельная разработка
    agent: agent-quest
    status: wave1
    paths: [src/takes/**, src/practice/practice-scenarios.ts]
    focus: "тейки · сценарии · кокпит 006 · план — от Никиты после доклада"
    forbidden: "чужие зоны · прод-код без Оператора"

  - id: B03
    name: Show — отдельная разработка
    agent: agent-show
    status: wave2             # формула: погружение → доклад → план Никиты
    paths: [src/components/Show/**, src/services/show*]
    focus: "show-сервисы ([renamed]-кейс 301) · сцены · план — от Никиты"
    forbidden: "снос без двойного подтверждения · чужие зоны"

  - id: B06
    name: Pitch (бывш. Notes) — ОТДЕЛЬНАЯ разработка
    agent: agent-pitch
    status: wave2             # формула: погружение → доклад → план Никиты
    paths: [src/audio/pitch/**, src/components/PitchTab*]
    focus: "PitchTab живой · worklet-YIN · коридор ±33/±50ц (вход готов) · узел-1 005_2 · план — от Никиты"
    forbidden: "замена YIN до вердикта 005_2 · переименование руками (007 по GO)"

  - id: B04
    name: Split — отдельная разработка
    agent: agent-split
    status: wave2             # формула: погружение → доклад → план Никиты
    paths: [src/components/MonitorMixPanel*, src/audio/engine-v3/monitor/**]
    focus: "MonitorRouter · SPLIT-устройства · калибровка · авто-микс · план — от Никиты"
    forbidden: "гейты монитора (V-Mix) — читать, ломать нельзя"

  - id: B01-fx
    name: Завод · этаж визуала
    agent: agent-visual-fx
    status: wave2
    paths: [src/foundation/reactions/**, src/components/**/Background*, src/services/*trigger*]
    focus: "фоны · HTML-эффекты · TriggerVisualService · audio-reactive (boot-гонка вылечена 6086bbf)"
    forbidden: "перф-регрессии (порог 60fps) · чужие зоны"

  - id: B05
    name: Ателье Styles (Темы)
    agent: agent-styles
    status: wave2
    paths: [src/components/StylesDeck*, src/components/ThemeSelector*]
    focus: "темы · палитры · MODE_COLORS (конфликт семантики с be/LiVE-парой — узел-3 005_2)"
    forbidden: "перезапись цветовой ДНК без вердикта цвет-науки"

sandbox:
  - id: B09-facade
    name: Дизайн каталога → песочница 007_2+006
    status: sandbox          # НЕ патруль: 006 уже делает пиксель-forensic GPT-референсов
    note: "визуал каталога = ветка 007_2 по GO Никиты после снятия паузы дизайна"
